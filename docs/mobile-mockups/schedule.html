<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>HWO Mobile — Schedule</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 390px; min-height: 844px; background: #f8fafc; color: #1e293b; }
    .status { height: 44px; background: #0f766e; }
    .header { background: #0f766e; color: white; padding: 16px 20px 24px; }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
    .tabs { display: flex; background: white; border-bottom: 1px solid #e2e8f0; }
    .tab { flex: 1; text-align: center; padding: 12px; font-size: 13px; color: #64748b; }
    .tab.active { color: #0f766e; border-bottom: 2px solid #0f766e; font-weight: 600; }
    .content { padding: 16px; }
    .card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
    .card .date { font-size: 12px; color: #64748b; }
    .card .shift { font-size: 16px; font-weight: 600; margin-top: 4px; }
    .card .dept { font-size: 13px; color: #0f766e; margin-top: 2px; }
    .badge { display: inline-block; background: #ccfbf1; color: #0f766e; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-top: 8px; }
    .btn { display: block; width: 100%; margin-top: 12px; padding: 10px; background: #0f766e; color: white; border: none; border-radius: 8px; font-size: 14px; }
    .nav { position: fixed; bottom: 0; width: 390px; display: flex; background: white; border-top: 1px solid #e2e8f0; padding: 8px 0 20px; }
    .nav-item { flex: 1; text-align: center; font-size: 11px; color: #64748b; }
    .nav-item.active { color: #0f766e; font-weight: 600; }
  </style>
</head>
<body>
  <div class="status"></div>
  <div class="header">
    <h1>My Schedule</h1>
    <p>Expo React Native · HWO Mobile App</p>
  </div>
  <div class="tabs">
    <div class="tab active">Schedule</div>
    <div class="tab">Wellness</div>
    <div class="tab">Alerts</div>
  </div>
  <div class="content">
    <div class="card">
      <div class="date">Today · Jun 18</div>
      <div class="shift">Day Shift · 07:00–15:00</div>
      <div class="dept">ICU · General Hospital</div>
      <span class="badge">Confirmed</span>
      <button class="btn">Request Shift Swap</button>
    </div>
    <div class="card">
      <div class="date">Tomorrow · Jun 19</div>
      <div class="shift">Night Shift · 19:00–07:00</div>
      <div class="dept">Emergency</div>
      <span class="badge">Scheduled</span>
    </div>
    <div class="card">
      <div class="date">Jun 20</div>
      <div class="shift">Off</div>
    </div>
  </div>
  <div class="nav">
    <div class="nav-item active">📅 Schedule</div>
    <div class="nav-item">💚 Wellness</div>
    <div class="nav-item">🔔 Alerts</div>
  </div>
</body>
</html>
