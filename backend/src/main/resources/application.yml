spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hwo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 128MB
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  # ── Email (OTP) ────────────────────────────────────────────────
  # Set MAIL_HOST, MAIL_PORT, MAIL_USER, MAIL_PASS via environment variables.
  # If left unconfigured the OTP code is printed to the backend console log instead.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 128MB
    max-swallow-size: 128MB
    allowed-host-pattern: .*

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-change-in-production-must-be-at-least-32-chars}
  expiration-ms: 28800000

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: ${AI_SERVICE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_SERVICE_READ_TIMEOUT_MS:300000}
